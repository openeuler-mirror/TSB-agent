syntax = "proto3";

package virtrust.protos;

// 迁移服务：前五个 RPC 在节点之间传递阶段消息，最后一个供本机 CLI/API 发起源端任务。
service MigrationService {
  // 1: 准备迁移
  rpc PrepareMigration (PrepareMigRequest) returns (PrepareMigReply) {}

  // 2: 交换公钥
  rpc ExchangePkAndReport(EXchangePkAndReportRequest) returns(EXchangePkAndReportReply) {}


  //3: 开始迁移
  rpc StartMigration(StartMigRequest) returns(StartMigReply) {}


  // 4：迁移虚机密码资源
  rpc  SendVRsourceData(VRsourceInfoRequest) returns(VRsourceInfoReply) {}

  //5: 通知迁移结果
  rpc  NotifyVRMigrateResult(MigrateResultRequest) returns (MigrateResultReply) {}

  // 6: 迁移请求
  rpc DomainMigrate(DomainMigraterRequest) returns (DomainMigraterReply) {}

}

message DomainMigraterRequest {
    string domainName = 1;
    string uuid = 2;
    string destUri = 3;
    string localUri = 4;
    uint32 flags = 5;
}

message DomainMigraterReply {
    // 数值业务码供既有控制流判断；诊断描述阶段、确认步骤和补偿失败。
    uint32 result = 1;
    MigrationDiagnostic diagnostic = 2;
}

message PrepareMigRequest {
     string domainName = 1;
     string uuid = 2;
     string destUri = 3;
     string localUri = 4;
     uint32 flags = 5;
}

message PrepareMigReply {
     uint32 result = 1;
     MigrationDiagnostic diagnostic = 2;
}

message EXchangePkAndReportRequest {
    string domainName = 1;
    string uuid = 2;
    string cert = 3;
    bytes publicKey = 4;  //公钥
    TrustReportNew hostReport = 5; // struct
    TrustReportNew vmReport = 6; // struct
}

message EXchangePkAndReportReply{
    uint32 result = 1;
    string domainName = 2;
    string uuid = 3;
    string cert = 4;
    bytes publicKey = 5;  //公钥
    TrustReportNew hostReport = 6; // struct
    TrustReportNew vmReport = 7; // struct
    bytes tcm2Key = 8;
     MigrationDiagnostic diagnostic = 9;
}

message StartMigRequest {
     string domainName = 1;
     string uuid = 2;
}

message StartMigReply {
     uint32 result = 1;
     MigrationDiagnostic diagnostic = 2;
}

message VRsourceInfoRequest{
   bytes cipherData = 1;
   string uuid = 2;
   Description vtpcmInfo = 3;
}

message  VRsourceInfoReply{
  uint32 result = 1;
  MigrationDiagnostic diagnostic = 2;
}

message MigrateResultRequest {
  uint32 result = 1;
  string domainName = 2;
  string uuid = 3;
}

message MigrateResultReply {
  uint32 result = 1;
  MigrationDiagnostic diagnostic = 2;
}

// 迁移诊断只携带结构化状态及原始码，不传输密钥、证书或密文。
enum MigrationOutcomeCode {
  MIGRATION_OUTCOME_UNKNOWN = 0;
  MIGRATION_OUTCOME_SUCCESS = 1;
  MIGRATION_OUTCOME_FAILED_BEFORE_EFFECT = 2;
  MIGRATION_OUTCOME_PARTIAL = 3;
}

enum MigrationStageCode {
  MIGRATION_STAGE_NONE = 0;
  MIGRATION_STAGE_PREFLIGHT = 1;
  MIGRATION_STAGE_PREPARE = 2;
  MIGRATION_STAGE_KEY_EXCHANGE = 3;
  MIGRATION_STAGE_START = 4;
  MIGRATION_STAGE_LIBVIRT_TRANSFER = 5;
  MIGRATION_STAGE_DATA_TRANSFER = 6;
  MIGRATION_STAGE_SOURCE_COMMIT = 7;
  MIGRATION_STAGE_DESTINATION_COMMIT = 8;
  MIGRATION_STAGE_SOURCE_CLEANUP = 9;
  MIGRATION_STAGE_UDS = 10;
}

enum MigrationSideCode {
  MIGRATION_SIDE_UNKNOWN = 0;
  MIGRATION_SIDE_SOURCE = 1;
  MIGRATION_SIDE_DESTINATION = 2;
}

enum MigrationOperationCode {
  MIGRATION_OPERATION_NONE = 0;
  MIGRATION_OPERATION_VALIDATE = 1;
  MIGRATION_OPERATION_ACQUIRE_ADMISSION = 2;
  MIGRATION_OPERATION_CONNECT_LIBVIRT = 3;
  MIGRATION_OPERATION_LOOKUP_DOMAIN = 4;
  MIGRATION_OPERATION_CHECK_IDENTITY = 5;
  MIGRATION_OPERATION_VERIFY_CERTIFICATE = 6;
  MIGRATION_OPERATION_VERIFY_REPORT = 7;
  MIGRATION_OPERATION_EXCHANGE_KEY = 8;
  MIGRATION_OPERATION_GET_CIPHER = 9;
  MIGRATION_OPERATION_IMPORT_CIPHER = 10;
  MIGRATION_OPERATION_CREATE_VROOT = 11;
  MIGRATION_OPERATION_MIGRATE_LIBVIRT = 12;
  MIGRATION_OPERATION_NOTIFY_TSB = 13;
  MIGRATION_OPERATION_NOTIFY_PEER = 14;
  MIGRATION_OPERATION_REMOVE_VROOT = 15;
  MIGRATION_OPERATION_UNDEFINE_DOMAIN = 16;
  MIGRATION_OPERATION_GET_CERTIFICATE = 17;
  MIGRATION_OPERATION_GET_REPORT = 18;
  MIGRATION_OPERATION_EXPORT_KEY = 19;
  MIGRATION_OPERATION_GET_DESCRIPTION = 20;
}

enum MigrationErrorOriginCode {
  MIGRATION_ERROR_ORIGIN_UNKNOWN = 0;
  MIGRATION_ERROR_ORIGIN_VALIDATION = 1;
  MIGRATION_ERROR_ORIGIN_TSB = 2;
  MIGRATION_ERROR_ORIGIN_LIBVIRT = 3;
  MIGRATION_ERROR_ORIGIN_GRPC = 4;
  MIGRATION_ERROR_ORIGIN_INTERNAL = 5;
}

message MigrationErrorInfo {
  MigrationStageCode stage = 1;
  MigrationSideCode side = 2;
  MigrationOperationCode operation = 3;
  MigrationErrorOriginCode origin = 4;
  bool has_raw_code = 5;
  int32 raw_code = 6;
}

message MigrationDiagnostic {
  // 仅记录已获得的证据；未知或部分完成时调用方必须提示人工核查。
  MigrationOutcomeCode outcome = 1;
  MigrationErrorInfo primary_error = 2;
  uint32 confirmed_steps = 3;
  repeated MigrationErrorInfo compensation_errors = 4;
  bool manual_check_required = 5;
}

// Trust report structures for migration
message GlobalControlPolicy {
  uint32 be_size = 1;
  uint32 be_boot_measure_on = 2;
  uint32 be_program_measure_on = 3;
  uint32 be_dynamic_measure_on = 4;
  uint32 be_boot_control = 5;
  uint32 be_program_control = 6;
  uint32 be_tsb_flag1 = 7;
  uint32 be_tsb_flag2 = 8;
  uint32 be_tsb_flag3 = 9;
  uint32 be_program_measure_mode = 10;
  uint32 be_program_use_cache = 11;
  uint32 be_dmeasure_use_cache = 12;
  uint32 be_dmeasure_max_busy_delay = 13;
  uint32 be_process_dmeasure_ref_mode = 14;
  uint32 be_process_dmeasure_match_mode = 15;
  uint32 be_process_measure_match_mode = 16;
  uint32 be_process_dmeasure_lib_mode = 17;
  uint32 be_process_verify_lib_mode = 18;
  uint32 be_process_dmeasure_sub_process_mode = 19;
  uint32 be_process_dmeasure_old_process_mode = 20;
  uint32 be_process_dmeasure_interval = 21;
}

message TrustReportContentNew {
  uint64 be_host_report_time = 1;
  uint64 be_host_startup_time = 2;
  bytes host_id = 3; // MAX_HOST_ID_SIZE (32 bytes)
  bytes tpcm_id = 4; // MAX_TPCM_ID_SIZE (32 bytes)
  GlobalControlPolicy global_control_policy = 5;
  uint32 be_eval = 6;
  uint32 be_host_ip = 7;
  uint32 be_illegal_program_load = 8;
  uint32 be_illegal_lib_load = 9;
  uint32 be_illegal_kernel_module_load = 10;
  uint32 be_illegal_file_access = 11;
  uint32 be_illegal_device_access = 12;
  uint32 be_illegal_network_inreq = 13;
  uint32 be_illegal_network_outreq = 14;
  uint32 be_process_code_measure_fail = 15;
  uint32 be_process_data_measure_fail = 16;
  uint32 be_notify_fail = 17;
  uint32 be_boot_measure_result = 18;
  uint32 be_boot_times = 19;
  uint32 be_tpcm_time = 20;
  uint32 be_tpcm_report_time = 21;
  uint32 be_log_number = 22;
  bytes log_hash = 23; // DEFAULT_HASH_SIZE (32 bytes)
  bytes bios_pcr = 24; // DEFAULT_PCR_SIZE (32 bytes)
  bytes boot_loader_pcr = 25; // DEFAULT_PCR_SIZE (32 bytes)
  bytes kernel_pcr = 26; // DEFAULT_PCR_SIZE (32 bytes)
  bytes tsb_pcr = 27; // DEFAULT_PCR_SIZE (32 bytes)
  bytes boot_pcr = 28; // DEFAULT_PCR_SIZE (32 bytes)
  uint64 be_nonce = 29;
}

message TrustReportNew {
  TrustReportContentNew content = 1;
  bytes append_data = 2; // MAX_TRUST_REPORT_APPENDDATA (50KB)
}

// VTPCM description structure
message Description {
  int32 state = 1;    // 启动，挂起等状态
  bytes name = 2;     // 名称，创建时有hw设置 (255 bytes)
  bytes uuid = 3;     // 虚拟机的uuid (37 bytes)
}
